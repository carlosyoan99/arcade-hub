    <!-- Schema.org / JSON-LD -->
    <script type="application/ld+json" id="website-schema">

        "@context": "https://schema.org",

      }

    <script type="application/ld+json" id="game-schema">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Arcade Engine",
        "description": "32 juegos arcade sobre Arcade Engine",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "browserRequirements": "HTML5 Canvas"
      }
    </script>
    <script type="application/ld+json" id="itemlist-schema">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Juegos de Arcade Engine",

        "numberOfItems": 32,

      }
    </script>

    <link rel="stylesheet" href="./demo/hub.css" />
  </head>
  <body>
    <a class="skip" href="#shelf">Saltar a la vitrina</a>

    <header class="topbar">
      <div class="brand">
        <h1>Arcade Engine</h1>
        <span class="brand__count" id="count">32 títulos</span>
      </div>
      <label class="search">
        <span class="visually-hidden">Buscar juegos</span>
        <input
          id="search"
          type="search"
          placeholder="Buscar título…"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
    </header>

    <main class="shell">
      <section id="shelf" aria-labelledby="shelf-title">
        <h2 id="shelf-title" class="section-title">La vitrina</h2>
        <ul id="grid" class="grid" aria-label="Juegos disponibles"></ul>
        <p id="empty" class="empty" hidden>No hay juegos para esa búsqueda.</p>
      </section>

      <section id="stage" class="stage" aria-labelledby="stage-title" hidden>
        <div class="stage__top">
          <button id="back" class="back" type="button">← Volver a la vitrina</button>
          <label class="difficulty">
            <span>Dificultad</span>
            <select id="difficulty" aria-label="Dificultad del juego">
              <option value="easy">Fácil</option>
              <option value="normal" selected>Normal</option>
              <option value="hard">Difícil</option>
            </select>
          </label>
          <h2 id="stage-title" class="stage__title"></h2>
        </div>
        <canvas id="screen" width="960" height="600" aria-label="Pantalla del juego">
          Tu navegador no admite canvas.
        </canvas>
        <p id="hint" class="hint"></p>
      </section>
    </main>

    <p id="status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
    <p id="results" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>

    <script type="module" src="./demo/main.ts"></script>
  </body>
</html>
