<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade Engine · demo</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, monospace; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05060f; color: #9aa5c4; }
      main { display: grid; gap: 12px; justify-items: center; padding: 16px; }
      header { display: flex; gap: 16px; align-items: center; }
      h1 { font-size: 14px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; margin: 0; }
      select { background: transparent; border: 1px solid #2b3358; color: #9aa5c4; padding: 6px 12px; font: inherit; cursor: pointer; border-radius: 4px; }
      select option { background: #05060f; }
      canvas { border: 1px solid #2b3358; border-radius: 6px; max-width: 100%; height: auto; image-rendering: auto; }
      p { margin: 0; font-size: 12px; opacity: .7; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Arcade Engine</h1>
        <select id="game" aria-label="Juego"></select>
      </header>
      <canvas id="screen" width="960" height="600"></canvas>
      <p id="hint">Teclado, gamepad o táctil · P pausa · R reinicio</p>
    </main>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
