<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Out Run — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M10 70 Q50 20 90 70' stroke='%23ff2d78' stroke-width='6' fill='none'/%3E%3Ccircle cx='50' cy='45' r='10' fill='%23ffb800'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" role="img" aria-label="Out Run - Arcade Hub"></canvas>
    <div id="hud">
      <div class="score-group">
        <div class="score-block score">
          <div class="label">Tiempo</div>
          <div class="value" id="timeValue">75</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block best">
          <div class="label">Puntos</div>
          <div class="value" id="scoreValue">0</div>
        </div>
      </div>
      <div class="speed-indicator">
        <div class="label">Vel.</div>
        <div class="value" id="speedValue">0</div>
      </div>
    </div>
    <div id="overlay">
      <h1><span class="accent">◈</span> OUT RUN <span class="accent">◈</span></h1>
      <p id="overlayText">Cruzá la highway esquivando autos. Turbo, ramas y 5 stages con música.</p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>←</kbd><kbd>→</kbd> girar &nbsp;·&nbsp; <kbd>↑</kbd> acelerar &nbsp;·&nbsp;
        <kbd>↓</kbd> frenar &nbsp;·&nbsp; <kbd>Espacio</kbd> turbo
      </p>
      <div class="version-badge">2D · canvas · pseudo-3D · sin dependencias</div>
    </div>
    <div id="touchControls">
      <div class="dpad">
        <button id="btnUp" aria-label="Acelerar">▲</button>
        <button id="btnLeft" aria-label="Izquierda">◀</button>
        <button id="btnTurbo" aria-label="Turbo" style="font-size: 1.4em">⚡</button>
        <button id="btnRight" aria-label="Derecha">▶</button>
        <button id="btnDown" aria-label="Frenar">▼</button>
      </div>
    </div>
    <div id="loading">Cargando…</div>
    <script type="module" src="./script.js"></script>
  </body>
</html>
