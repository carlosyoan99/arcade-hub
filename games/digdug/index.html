<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Dig Dug — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='20' y='30' width='60' height='40' rx='4' fill='%23806040'/%3E%3Crect x='30' y='20' width='40' height='10' rx='2' fill='%236ee7b7'/%3E%3Ccircle cx='42' cy='25' r='5' fill='%23ff6b6b'/%3E%3Ccircle cx='58' cy='25' r='5' fill='%23ff6b6b'/%3E%3Crect x='35' y='60' width='30' height='8' rx='4' fill='%236ee7b7'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" aria-label="Dig Dug - Arcade Hub"></canvas>
    <div id="hud">
      <div class="sg">
        <div class="sb score">
          <div class="label">Puntaje</div>
          <div class="value" id="scoreValue">0</div>
        </div>
        <div class="sp">·</div>
        <div class="sb lives">
          <div class="label">Vidas</div>
          <div class="value" id="livesValue">●●●</div>
        </div>
        <div class="sp">·</div>
        <div class="sb best">
          <div class="label">Record</div>
          <div class="value" id="bestValue">0</div>
        </div>
      </div>
    </div>

    <div id="overlay">
      <h1><span class="accent">◈</span> DIG DUG <span class="accent">◈</span></h1>
      <p id="ot">
        Excava tuneles en la tierra. Infla a los enemigos hasta que exploten o deja caer rocas sobre
        ellos.
      </p>
      <p id="fs" style="display: none"></p>
      <p class="hint" id="he">
        <kbd>←</kbd><kbd>→</kbd> <kbd>↑</kbd><kbd>↓</kbd> mover &nbsp;·&nbsp;
        <kbd>Espacio</kbd> inflar / empezar
      </p>
      <div class="vb">2D · canvas · sin dependencias</div>
    </div>

    <div id="tc">
      <button id="bL" aria-label="Izquierda">◀</button>
      <button id="bU" aria-label="Arriba">▲</button>
      <button id="bR" aria-label="Derecha">▶</button>
      <button id="bD" aria-label="Abajo">▼</button>
      <button id="bF" class="btn-fire" aria-label="Inflar">🔧</button>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
