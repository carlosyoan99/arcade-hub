<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Joust — Arcade Hub</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='45' r='30' fill='%23c084fc'/%3E%3Cpath d='M20 70 L35 40 L50 70 L65 40 L80 70' stroke='%23ffb800' stroke-width='6' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" aria-label="Joust - Arcade Hub"></canvas>
    <!-- HUD -->
    <div id="hud">
      <div class="sg">
        <div class="sb">
          <div class="label">Puntaje</div>
          <div class="value" id="scoreDisplay">0</div>
        </div>
        <span class="sp">|</span>
        <div class="sb">
          <div class="label">Oleada</div>
          <div class="value" id="waveDisplay">1</div>
        </div>
        <span class="sp">|</span>
        <div class="sb">
          <div class="label">Vidas</div>
          <div class="value" id="livesDisplay">3</div>
        </div>
      </div>
    </div>

    <!-- Overlay -->
    <div id="overlay">
      <h1>🦅 <span class="accent">JOUST</span></h1>
      <p id="overlayText">
        Montá tu avestruz y derrotá a los jinetes enemigos.<br />
        Golpeá <strong>desde arriba</strong> para vencer.
      </p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>←</kbd><kbd>→</kbd> mover &nbsp;·&nbsp; <kbd>Espacio</kbd> / <kbd>↑</kbd> aletear
        &nbsp;·&nbsp; tocar para empezar · <kbd>R</kbd> reiniciar
      </p>
      <div class="version-badge">2D · canvas · sin dependencias</div>
    </div>

    <!-- Touch controls -->
    <div id="touchControls">
      <div class="dpad">
        <button class="empty"></button>
        <button id="btnUp" aria-label="Aletear">▲</button>
        <button class="empty"></button>
        <button id="btnLeft" aria-label="Izquierda">◀</button>
        <button class="empty"></button>
        <button id="btnRight" aria-label="Derecha">▶</button>
      </div>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
