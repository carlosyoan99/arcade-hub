<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Dino Runner — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='22' y='36' width='28' height='20' rx='4' fill='%236ee7b7'/%3E%3Crect x='40' y='22' width='14' height='14' rx='3' fill='%236ee7b7'/%3E%3Ccircle cx='49' cy='26' r='3' fill='%23fff'/%3E%3Crect x='16' y='32' width='6' height='12' rx='2' fill='%233fae5c'/%3E%3Crect x='66' y='38' width='8' height='26' rx='3' fill='%233fae5c'/%3E%3Crect x='73' y='44' width='6' height='14' rx='2' fill='%233fae5c'/%3E%3Cline x1='10' y1='64' x2='90' y2='64' stroke='%236ee7b7' stroke-width='2' opacity='0.3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" aria-label="Dino Runner - Arcade Hub"></canvas>
    <!-- HUD -->
    <div id="hud">
      <div class="score-group">
        <div class="score-block dist">
          <div class="label">Distancia</div>
          <div class="value" id="distValue">0</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block speed">
          <div class="label">Velocidad</div>
          <div class="value" id="speedValue">1</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block best">
          <div class="label">Récord</div>
          <div class="value" id="bestValue">0</div>
        </div>
      </div>
    </div>

    <!-- Overlay de inicio / fin -->
    <div id="overlay">
      <h1><span class="accent">🦖</span> DINO RUNNER <span class="accent">🦖</span></h1>
      <p id="overlayText">
        Corré, saltá y agachate para esquivar cactus y pterodáctilos. Sobreviví el mayor tiempo
        posible.
      </p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>Espacio</kbd> / <kbd>↑</kbd> saltar &nbsp;·&nbsp; <kbd>↓</kbd> agacharse
      </p>
      <div class="version-badge">2D · canvas · sin dependencias</div>
    </div>

    <!-- Touch controls -->
    <div id="touchControls">
      <button id="btnDuck" aria-label="Agacharse">▼ AGACHAR</button>
      <button id="btnJump" class="btn-jump" aria-label="Saltar">▲ SALTAR</button>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
