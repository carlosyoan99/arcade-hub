<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moon Patrol — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23333'/%3E%3Ccircle cx='35' cy='40' r='8' fill='%23555'/%3E%3Ccircle cx='65' cy='55' r='12' fill='%23555'/%3E%3Crect x='20' y='60' width='60' height='15' rx='5' fill='%23ffb800'/%3E%3Ccircle cx='30' cy='75' r='6' fill='%23333'/%3E%3Ccircle cx='70' cy='75' r='6' fill='%23333'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" role="img" aria-label="Moon Patrol - Arcade Hub"></canvas>
    <!-- HUD -->
    <div id="hud">
      <div class="score-group">
        <div class="score-block score">
          <div class="label">Puntos</div>
          <div class="value" id="scoreValue">0</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block best">
          <div class="label">Mejor</div>
          <div class="value" id="bestValue">0</div>
        </div>
      </div>
      <div class="speed-indicator">
        <div class="label">Nivel</div>
        <div class="value" id="levelValue">1</div>
      </div>
    </div>

    <!-- Overlay -->
    <div id="overlay">
      <h1><span class="accent">◈</span> MOON PATROL <span class="accent">◈</span></h1>
      <p id="overlayText">
        Patrullá la luna esquivando cráteres y destruyendo enemigos. Dispará hacia adelante y hacia
        arriba.
      </p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>↑</kbd> saltar &nbsp;·&nbsp; <kbd>→</kbd> disparar adelante &nbsp;·&nbsp;
        <kbd>↑</kbd>+<kbd>→</kbd> disparar arriba &nbsp;·&nbsp; <kbd>Espacio</kbd> pausa
      </p>
      <div class="version-badge">2D · canvas · sin dependencias</div>
    </div>

    <!-- Touch controls -->
    <div id="touchControls">
      <div class="dpad">
        <button id="btnUp" aria-label="Saltar">▲</button>
        <button id="btnLeft" aria-label="Disparar arriba" style="font-size: 0.9em">↗</button>
        <div class="empty"></div>
        <button id="btnRight" aria-label="Disparar">▶</button>
        <button id="btnDown" aria-label="Pausa">⏸</button>
      </div>
    </div>

    <div id="loading">Cargando…</div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
