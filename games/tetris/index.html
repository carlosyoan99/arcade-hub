<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Tetris — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='36' y='18' width='24' height='20' rx='4' fill='%2344ddff'/%3E%3Crect x='36' y='40' width='24' height='20' rx='4' fill='%2344ddff'/%3E%3Crect x='36' y='62' width='24' height='20' rx='4' fill='%2344ddff'/%3E%3Crect x='60' y='62' width='22' height='20' rx='4' fill='%2344ddff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <span>◈ Cargando...</span>
    </div>
    <canvas id="gc" aria-label="Tetris - Arcade Hub"></canvas>
    <div id="announce" aria-live="polite" aria-atomic="true" class="sr-only"></div>

    <div id="hud">
      <div class="sg">
        <div class="sb score">
          <div class="label">Pts</div>
          <div class="value" id="sc">0</div>
        </div>
        <div class="sp">·</div>
        <div class="sb lines">
          <div class="label">Líneas</div>
          <div class="value" id="ln">0</div>
        </div>
        <div class="sp">·</div>
        <div class="sb level">
          <div class="label">Nivel</div>
          <div class="value" id="lv">1</div>
        </div>
        <div class="sp">·</div>
        <div class="sb best">
          <div class="label">Récord</div>
          <div class="value" id="bst">0</div>
        </div>
      </div>
    </div>

    <div id="overlay">
      <h1><span class="accent">◈</span> TETRIS <span class="accent">◈</span></h1>
      <p id="ot">
        Armá líneas completas con las piezas que caen. Cada nivel es más rápido. ¡A ver cuánto
        durás!
      </p>
      <p id="fs" style="display: none"></p>
      <p class="hint" id="he">
        <kbd>←</kbd><kbd>→</kbd> mover &nbsp;·&nbsp; <kbd>↑</kbd> rotar &nbsp;·&nbsp;
        <kbd>↓</kbd> bajar &nbsp;·&nbsp; <kbd>Espacio</kbd> drop &nbsp;·&nbsp; empezar
      </p>
      <div class="vb">2D · canvas · sin dependencias</div>
    </div>

    <div id="tc">
      <div class="dp">
        <button id="bL" aria-label="Izquierda">◀</button>
        <button id="bR" aria-label="Derecha">▶</button>
        <button id="bRot" class="btn-rot" aria-label="Rotar">↻ ROT</button>
        <button id="bDrop" class="btn-drop" aria-label="Drop">⬇ DROP</button>
      </div>
    </div>

    <script type="module" src="./script.js"></script>

    <div id="gameBar">
      <button id="hubBtn" aria-label="Volver al Arcade Hub" title="Volver al Arcade Hub">
        ← Arcade
      </button>
      <button id="fsBtn" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
      <button id="helpBtn" aria-label="Ayuda" title="Ayuda">❓</button>
    </div>
  </body>
</html>
