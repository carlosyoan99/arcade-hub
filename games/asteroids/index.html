<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Asteroids — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,15 35,68 65,68' fill='%236ec6ff'/%3E%3Ccircle cx='20' cy='42' r='12' fill='none' stroke='%23b0c8d8' stroke-width='2.5'/%3E%3Ccircle cx='78' cy='35' r='10' fill='none' stroke='%23b0c8d8' stroke-width='2.5'/%3E%3Ccircle cx='82' cy='70' r='8' fill='none' stroke='%23b0c8d8' stroke-width='2.5'/%3E%3Ccircle cx='28' cy='75' r='6' fill='none' stroke='%23b0c8d8' stroke-width='2.5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <span>◈ Cargando...</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="score-group">
        <div class="score-block score">
          <div class="label">Puntos</div>
          <div class="value" id="scoreValue">0</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block lives">
          <div class="label">Naves</div>
          <div class="value" id="livesValue">●●●</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block best">
          <div class="label">Récord</div>
          <div class="value" id="bestValue">0</div>
        </div>
      </div>
    </div>

    <div id="overlay">
      <h1><span class="accent">◈</span> ASTEROIDS <span class="accent">◈</span></h1>
      <p id="overlayText">
        Destruí asteroides con tu nave. Los grandes se parten en dos medianos, y los medianos en dos
        chicos. ¡Cuidado con no chocar!
      </p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>←</kbd><kbd>→</kbd> girar &nbsp;·&nbsp; <kbd>↑</kbd> impulso &nbsp;·&nbsp;
        <kbd>Espacio</kbd> disparar &nbsp;·&nbsp; empezar
      </p>
      <div class="version-badge">2D · canvas · sin dependencias</div>
    </div>

    <div id="touchControls">
      <div class="dpad">
        <button id="btnRotL" aria-label="Girar izq">◀ GIRAR</button>
        <button id="btnThrust" aria-label="Impulso">▲ IMPULSO</button>
        <button id="btnRotR" aria-label="Girar der">GIRAR ▶</button>
        <button id="btnFire" class="btn-fire" aria-label="Disparar" style="grid-column: 2">
          🔥 DISPARAR
        </button>
      </div>
    </div>

    <script type="module" src="./script.js"></script>

    <div id="gameBar">
      <button id="hubBtn" aria-label="Volver al Arcade Hub" title="Volver al Arcade Hub">
        ← Arcade
      </button>
      <button id="fsBtn" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
      <button id="helpBtn" aria-label="Ayuda" title="Ayuda">❓</button>
    </div>
  </body>
</html>
