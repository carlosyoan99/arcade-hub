<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Pac-Man — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50,10 A40,40 0 1,1 10,50 L50,50 Z' fill='%23ffe066'/%3E%3Ccircle cx='68' cy='35' r='4' fill='%23fff'/%3E%3Ccircle cx='20' cy='50' r='3' fill='%23ffe066' opacity='0.4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <span>◈ Cargando...</span>
    </div>
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="sg">
        <div class="sb score">
          <div class="label">Puntaje</div>
          <div class="value" id="sc">0</div>
        </div>
        <div class="sb lives"><div class="value" id="lv">●●●</div></div>
        <div class="sb best">
          <div class="label">Récord</div>
          <div class="value" id="bst">0</div>
        </div>
      </div>
    </div>

    <div id="overlay">
      <h1><span class="accent">◈</span> PAC-MAN <span class="accent">◈</span></h1>
      <p id="overlayText">
        Comé todos los puntos para ganar. Los power pellets te permiten comer fantasmas
        temporalmente. ¡Cuidado con Blinky, Pinky, Inky y Clyde!
      </p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> mover &nbsp;·&nbsp; empezar
      </p>
      <div class="vb">2D · canvas · sin dependencias</div>
    </div>

    <div id="tc">
      <div class="dp">
        <div class="empty"></div>
        <button id="btnUp" aria-label="Arriba">▲</button>
        <div class="empty"></div>
        <button id="btnLeft" aria-label="Izquierda">◀</button>
        <button id="btnPause" aria-label="Pausa" style="font-size: 12px">II</button>
        <button id="btnRight" aria-label="Derecha">▶</button>
        <div class="empty"></div>
        <button id="btnDown" aria-label="Abajo">▼</button>
        <div class="empty"></div>
      </div>
    </div>

    <script type="module" src="./script.js"></script>

    <div id="gameBar">
      <button id="hubBtn" aria-label="Volver al Arcade Hub" title="Volver al Arcade Hub">
        ← Arcade
      </button>
      <button id="fsBtn" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
      <button id="helpBtn" aria-label="Ayuda" title="Ayuda">❓</button>
    </div>
  </body>
</html>
