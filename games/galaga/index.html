<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galaga — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,10 38,28 62,28' fill='%236ee7b7'/%3E%3Crect x='42' y='28' width='16' height='20' rx='3' fill='%236ee7b7'/%3E%3Crect x='38' y='48' width='24' height='6' rx='2' fill='%236ee7b7'/%3E%3Cpolygon points='50,10 38,28 62,28' fill='%23a8ffe0' opacity='0.3'/%3E%3Ccircle cx='50' cy='35' r='4' fill='%23fff'/%3E%3Crect x='15' y='20' width='14' height='14' rx='3' fill='%23ff6b6b'/%3E%3Crect x='71' y='20' width='14' height='14' rx='3' fill='%23ff6b6b'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" role="img" aria-label="Galaga - Arcade Hub"></canvas>
    <div id="hud">
      <div class="sg">
        <div class="sb score">
          <div class="label">Puntaje</div>
          <div class="value" id="scoreValue">0</div>
        </div>
        <div class="sp">·</div>
        <div class="sb lives">
          <div class="label">Naves</div>
          <div class="value" id="livesValue">●●●</div>
        </div>
        <div class="sp">·</div>
        <div class="sb wave">
          <div class="label">Oleada</div>
          <div class="value" id="waveValue">1</div>
        </div>
        <div class="sp">·</div>
        <div class="sb best">
          <div class="label">Récord</div>
          <div class="value" id="bestValue">0</div>
        </div>
      </div>
    </div>

    <div id="overlay">
      <h1><span class="accent">◈</span> GALAGA <span class="accent">◈</span></h1>
      <p id="ot">
        Destruí los invasores en formación. Algunos bajarán en picada. ¡Sobreviví y sumá puntos!
      </p>
      <p id="fs" style="display: none"></p>
      <p class="hint" id="he">
        <kbd>←</kbd><kbd>→</kbd> mover &nbsp;·&nbsp; <kbd>Espacio</kbd> disparar / empezar
      </p>
      <div class="vb">2D · canvas · sin dependencias</div>
    </div>

    <div id="tc">
      <button id="bL" aria-label="Izquierda">◀</button>
      <button id="bF" class="btn-fire" aria-label="Disparar">🔥</button>
      <button id="bR" aria-label="Derecha">▶</button>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
