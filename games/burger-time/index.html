<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BurgerTime — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='20' y='20' width='60' height='12' rx='6' fill='%23ffb800'/%3E%3Crect x='25' y='35' width='50' height='8' rx='2' fill='%2339ff14'/%3E%3Crect x='25' y='45' width='50' height='8' rx='2' fill='%23ff2d78'/%3E%3Crect x='20' y='56' width='60' height='12' rx='6' fill='%23ffb800'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" role="img" aria-label="BurgerTime - Arcade Hub"></canvas>
    <div id="hud">
      <div class="score-group">
        <div class="score-block score">
          <div class="label">Puntos</div>
          <div class="value" id="scoreValue">0</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block best">
          <div class="label">Mejor</div>
          <div class="value" id="bestValue">0</div>
        </div>
      </div>
      <div class="speed-indicator">
        <div class="label">Nivel</div>
        <div class="value" id="levelValue">1</div>
      </div>
    </div>
    <div id="overlay">
      <h1><span class="accent">◈</span> BURGERTIME <span class="accent">◈</span></h1>
      <p id="overlayText">Caminá sobre los ingredientes para hacerlos caer y armar las burgers. Esquivá a los enemigos.</p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>←</kbd><kbd>→</kbd> mover &nbsp;·&nbsp; <kbd>↑</kbd><kbd>↓</kbd> escaleras
        &nbsp;·&nbsp; <kbd>Z</kbd> pepper &nbsp;·&nbsp; <kbd>R</kbd> reiniciar
      </p>
      <div class="version-badge">2D · canvas · sin dependencias</div>
    </div>
    <div id="touchControls">
      <div class="dpad">
        <button id="btnUp" aria-label="Escalera arriba">▲</button>
        <button id="btnLeft" aria-label="Izquierda">◀</button>
        <button id="btnPepper" aria-label="Pepper" style="font-size:1.2em">🌶️</button>
        <button id="btnRight" aria-label="Derecha">▶</button>
        <button id="btnDown" aria-label="Escalera abajo">▼</button>
      </div>
    </div>
    <div id="loading">Cargando…</div>
    <script type="module" src="./script.js"></script>
  </body>
</html>
