<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout 3D</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #10091a;
    font-family: 'Courier New', monospace;
  }
  #canvas-container { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 20px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 24px;
    color: #eaeaea;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  #hud .score-block { text-align: left; }
  #hud .lives-block { text-align: center; }
  #hud .best-block { text-align: right; }
  #hud .label { font-size: 11px; letter-spacing: 2px; opacity: 0.6; }
  #hud .value { font-size: 26px; font-weight: bold; }
  #hud .lives-block .value { font-size: 20px; letter-spacing: 4px; }

  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: radial-gradient(circle at 50% 40%, rgba(40,25,60,0.55), rgba(10,6,18,0.88));
    color: #f2f2f2;
    text-align: center;
    z-index: 20;
    transition: opacity 0.25s ease;
  }
  #overlay h1 { font-size: 28px; letter-spacing: 3px; }
  #overlay p { opacity: 0.75; font-size: 13px; max-width: 340px; line-height: 1.6; }
  #overlay .hint { font-size: 12px; opacity: 0.5; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #finalScore { font-size: 15px; opacity: 0.9; }

  kbd {
    display: inline-block; padding: 2px 8px; margin: 0 2px;
    border: 1px solid #999; border-radius: 4px;
    font-size: 11px; background: rgba(255,255,255,0.08);
  }

  #touchControls {
    position: fixed; bottom: 24px; left: 0; right: 0;
    display: none; justify-content: center; gap: 16px;
    z-index: 15;
  }
  #touchControls button {
    width: 84px; height: 64px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff; font-size: 13px; letter-spacing: 1px;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s ease, transform 0.1s ease;
  }
  #touchControls button:active,
  #touchControls button.is-pressed {
    background: rgba(255,255,255,0.28);
    transform: scale(0.94);
  }
  @media (hover: none) and (pointer: coarse) {
    #touchControls { display: flex; }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="hud">
  <div class="score-block">
    <div class="label">PUNTOS</div>
    <div class="value" id="scoreValue">0</div>
  </div>
  <div class="lives-block">
    <div class="label">VIDAS</div>
    <div class="value" id="livesValue">●●●</div>
  </div>
  <div class="best-block">
    <div class="label">MEJOR</div>
    <div class="value" id="bestValue">0</div>
  </div>
</div>

<div id="overlay">
  <h1>BREAKOUT 3D</h1>
  <p id="overlayText">Movete para no dejar caer la pelota y romper todos los ladrillos. Los niveles se repiten cada vez más rápido.</p>
  <p class="hint" id="hintEl"><kbd>←</kbd><kbd>→</kbd> mover &nbsp;·&nbsp; <kbd>ESPACIO</kbd> lanzar / empezar</p>
</div>

<div id="touchControls">
  <button id="btnLeft">◀ IZQ.</button>
  <button id="btnLaunch">LANZAR</button>
  <button id="btnRight">DER. ▶</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* ============================================================
   BREAKOUT 3D
   Vanilla JS + Three.js (única dependencia externa, justificada
   por el renderizado 3D). Un solo archivo, sin build step.
   Estética 2.5D: cámara angulada sobre un plano de juego, en la
   misma línea que Pong 3D.
   ============================================================ */

// ---------- Constantes de juego ----------
const COURT_HALF_WIDTH = 7.5;   // eje X: límites izquierda/derecha
const TOP_WALL_Z       = -6.5;  // eje Z: muro superior
const PADDLE_Z         = 5.2;   // posición fija de la paleta en Z
const LOSE_Z           = 6.4;   // si la pelota supera esta Z, se pierde una vida
const PADDLE_HALF_W    = 1.15;
const PADDLE_SPEED     = 11;
const BALL_RADIUS      = 0.22;
const BALL_LAUNCH_SPEED_BASE = 7;
const BALL_MAX_SPEED   = 15;
const BALL_HIT_GROWTH  = 1.01;   // leve aceleración por golpe de paleta
const LEVEL_SPEED_GROWTH = 1.08; // aceleración al pasar de nivel
const START_LIVES      = 3;

const BRICK_ROWS = 5;
const BRICK_COLS = 9;
const BRICK_W = 1.45;
const BRICK_H = 0.45;
const BRICK_D = 0.55;
const BRICK_GAP = 0.18;
const BRICK_TOP_MARGIN = 0.6; // distancia desde el muro superior a la primera fila

const ROW_COLORS = [0xff6b6b, 0xffa76b, 0xffe066, 0x6ee7b7, 0x6ec6ff];
const ROW_POINTS = [50, 40, 30, 20, 10]; // de arriba (más valor) a abajo

// ---------- Estado global ----------
const state = {
  running: false,
  gameOver: false,
  waitingToLaunch: true,
  score: 0,
  lives: START_LIVES,
  level: 1,
  best: Number(localStorage.getItem('breakout3d_best') || 0),
  ballSpeed: BALL_LAUNCH_SPEED_BASE,
};

// ---------- Escena / cámara / render ----------
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10091a);
scene.fog = new THREE.Fog(0x10091a, 18, 38);

const camera = new THREE.PerspectiveCamera(
  52, window.innerWidth / window.innerHeight, 0.1, 200
);
camera.position.set(0, 12.5, 12);
camera.lookAt(0, 0, -1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// ---------- Luces ----------
const hemi = new THREE.HemisphereLight(0xb79aff, 0x10091a, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe3c2, 1.0);
sun.position.set(-6, 15, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -12;
scene.add(sun);

const ballLight = new THREE.PointLight(0xffe08a, 1.1, 6);
scene.add(ballLight);

// ---------- Cancha ----------
const courtMat = new THREE.MeshStandardMaterial({ color: 0x1a1030, roughness: 0.9 });
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(COURT_HALF_WIDTH * 2 + 1, 0.3, (LOSE_Z - TOP_WALL_Z) + 1.5),
  courtMat
);
floor.position.set(0, -0.15, (TOP_WALL_Z + LOSE_Z) / 2);
floor.receiveShadow = true;
scene.add(floor);

// Muros laterales y superior (con destello al rebotar)
const wallMat = new THREE.MeshStandardMaterial({ color: 0x7a5cff, emissive: 0x241166, roughness: 0.4 });
const wallDepth = LOSE_Z - TOP_WALL_Z + 1;
const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, wallDepth), wallMat.clone());
leftWall.position.set(-COURT_HALF_WIDTH - 0.15, 0.25, (TOP_WALL_Z + LOSE_Z) / 2);
leftWall.castShadow = true;
scene.add(leftWall);

const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, wallDepth), wallMat.clone());
rightWall.position.set(COURT_HALF_WIDTH + 0.15, 0.25, (TOP_WALL_Z + LOSE_Z) / 2);
rightWall.castShadow = true;
scene.add(rightWall);

const topWall = new THREE.Mesh(new THREE.BoxGeometry(COURT_HALF_WIDTH * 2 + 0.6, 0.5, 0.3), wallMat.clone());
topWall.position.set(0, 0.25, TOP_WALL_Z - 0.15);
topWall.castShadow = true;
scene.add(topWall);

const sideWalls = [leftWall, rightWall, topWall];

function flashWall(wall) {
  wall.material.emissiveIntensity = 3;
}

// ---------- Paleta ----------
const paddleGeo = new THREE.BoxGeometry(PADDLE_HALF_W * 2, 0.4, 0.5);
const paddleMat = new THREE.MeshStandardMaterial({ color: 0x6ec6ff, emissive: 0x0d2a4a, roughness: 0.5 });
const paddle = new THREE.Mesh(paddleGeo, paddleMat);
paddle.position.set(0, 0.2, PADDLE_Z);
paddle.castShadow = true;
scene.add(paddle);

// ---------- Pelota ----------
const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffdca0, emissiveIntensity: 0.6, roughness: 0.3 });
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS, 16, 16), ballMat);
ball.castShadow = true;
ball.position.y = BALL_RADIUS;
scene.add(ball);

const ballState = { x: 0, z: 0, vx: 0, vz: 0, prevX: 0, prevZ: 0 };

function parkBallOnPaddle() {
  ballState.x = paddle.position.x;
  ballState.z = PADDLE_Z - 0.55;
  ballState.vx = 0;
  ballState.vz = 0;
  state.waitingToLaunch = true;
}

function launchBall() {
  if (!state.running || state.gameOver || !state.waitingToLaunch) return;
  state.waitingToLaunch = false;
  const angle = (Math.random() - 0.5) * 0.6;
  ballState.vx = Math.sin(angle);
  ballState.vz = -Math.cos(angle);
  playLaunchSound();
}

// ---------- Ladrillos ----------
const brickGeo = new THREE.BoxGeometry(BRICK_W, BRICK_H, BRICK_D);
const bricks = [];

function buildBricks() {
  for (const b of bricks) scene.remove(b.mesh);
  bricks.length = 0;

  const rowWidth = BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP;
  const startX = -rowWidth / 2 + BRICK_W / 2;
  const startZ = TOP_WALL_Z + BRICK_TOP_MARGIN + BRICK_D / 2;

  for (let row = 0; row < BRICK_ROWS; row++) {
    const mat = new THREE.MeshStandardMaterial({
      color: ROW_COLORS[row % ROW_COLORS.length],
      emissive: ROW_COLORS[row % ROW_COLORS.length],
      emissiveIntensity: 0.15,
      roughness: 0.55,
    });
    for (let col = 0; col < BRICK_COLS; col++) {
      const mesh = new THREE.Mesh(brickGeo, mat.clone());
      mesh.position.set(
        startX + col * (BRICK_W + BRICK_GAP),
        0.25,
        startZ + row * (BRICK_D + BRICK_GAP)
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      bricks.push({
        mesh,
        halfW: BRICK_W / 2,
        halfD: BRICK_D / 2,
        points: ROW_POINTS[row % ROW_POINTS.length],
        color: ROW_COLORS[row % ROW_COLORS.length],
      });
    }
  }
}

// ---------- Sonido (sintetizado con Web Audio API) ----------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep({ freq = 440, freqEnd = null, duration = 0.12, type = 'sine', volume = 0.2 }) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
  gain.gain.setValueAtTime(volume, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration);
}
function playWallBounce() { beep({ freq: 260, freqEnd: 300, duration: 0.06, type: 'sine', volume: 0.12 }); }
function playPaddleHit() { beep({ freq: 340, freqEnd: 440, duration: 0.08, type: 'square', volume: 0.16 }); }
function playBrickBreak(points) {
  beep({ freq: 500 + points * 4, freqEnd: 800 + points * 4, duration: 0.09, type: 'triangle', volume: 0.18 });
}
function playLaunchSound() { beep({ freq: 300, freqEnd: 500, duration: 0.1, type: 'square', volume: 0.14 }); }
function playLifeLostSound() { beep({ freq: 260, freqEnd: 90, duration: 0.4, type: 'sawtooth', volume: 0.22 }); }
function playLevelClearFanfare() {
  [660, 880, 1100].forEach((freq, i) => {
    setTimeout(() => beep({ freq, duration: 0.12, type: 'triangle', volume: 0.18 }), i * 90);
  });
}
function playGameOverTone() {
  [440, 330, 220, 110].forEach((freq, i) => {
    setTimeout(() => beep({ freq, duration: 0.22, type: 'sawtooth', volume: 0.2 }), i * 140);
  });
}

// ---------- Partículas (chispas de contacto y debris de ladrillos) ----------
const particles = [];
const sparkGeo = new THREE.SphereGeometry(0.05, 6, 6);
const debrisGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);

function spawnParticles(position, { count = 10, geometry = sparkGeo, color = 0xffffff, speed = 2, upBias = 2.2, life = 0.4, gravity = -10 } = {}) {
  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
    const mesh = new THREE.Mesh(geometry, mat);
    mesh.position.copy(position);
    scene.add(mesh);
    const angle = Math.random() * Math.PI * 2;
    const radial = (0.4 + Math.random() * 0.6) * speed;
    particles.push({
      mesh,
      velocity: new THREE.Vector3(Math.cos(angle) * radial, upBias * (0.4 + Math.random() * 0.6), Math.sin(angle) * radial),
      gravity,
      life,
      maxLife: life,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.velocity.y += p.gravity * dt;
    p.mesh.position.addScaledVector(p.velocity, dt);
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.material.dispose();
      particles.splice(i, 1);
      continue;
    }
    p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
  }
}

// ---------- Entrada: teclado ----------
const keys = { left: false, right: false };

window.addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); keys.left = true; }
  if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); keys.right = true; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (!state.running) startGame();
    else launchBall();
  }
  if (e.code === 'KeyR' && !state.running) {
    e.preventDefault();
    startGame();
  }
});
window.addEventListener('keyup', (e) => {
  if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
  if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
});

// ---------- Entrada: táctil ----------
function bindHoldButton(btn, onDown, onUp) {
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); btn.classList.add('is-pressed'); });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); btn.classList.remove('is-pressed'); });
  btn.addEventListener('touchcancel', (e) => { e.preventDefault(); onUp(); btn.classList.remove('is-pressed'); });
}
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnLaunch = document.getElementById('btnLaunch');
bindHoldButton(btnLeft, () => { keys.left = true; }, () => { keys.left = false; });
bindHoldButton(btnRight, () => { keys.right = true; }, () => { keys.right = false; });
btnLaunch.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (!state.running) startGame();
  else launchBall();
});

container.addEventListener('pointerdown', () => {
  if (!state.running) startGame();
  else launchBall();
});

// ---------- Entrada: gamepad ----------
let gamepadIndex = null;
let prevStart = false;
let gamepadAxis = 0;

window.addEventListener('gamepadconnected', (e) => { gamepadIndex = e.gamepad.index; });
window.addEventListener('gamepaddisconnected', (e) => { if (gamepadIndex === e.gamepad.index) gamepadIndex = null; });

function pollGamepad() {
  if (!navigator.getGamepads) return;
  const pads = navigator.getGamepads();
  const gp = (gamepadIndex !== null ? pads[gamepadIndex] : null) || pads[0];
  if (!gp) { gamepadAxis = 0; return; }

  const stick = gp.axes[0] ?? 0;
  gamepadAxis = Math.abs(stick) > 0.15 ? stick : 0;

  const dpadLeft = !!gp.buttons[14]?.pressed;
  const dpadRight = !!gp.buttons[15]?.pressed;
  if (dpadLeft) gamepadAxis = -1;
  if (dpadRight) gamepadAxis = 1;

  const startHeld = !!(gp.buttons[9]?.pressed || gp.buttons[0]?.pressed);
  if (startHeld && !prevStart) {
    if (!state.running) startGame();
    else launchBall();
  }
  prevStart = startHeld;
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- HUD / Overlay ----------
const scoreValue = document.getElementById('scoreValue');
const livesValue = document.getElementById('livesValue');
const bestValue = document.getElementById('bestValue');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const hintEl = document.getElementById('hintEl');

const finalScoreEl = document.createElement('p');
finalScoreEl.id = 'finalScore';
finalScoreEl.style.display = 'none';
overlay.insertBefore(finalScoreEl, hintEl);

overlay.addEventListener('pointerdown', () => {
  if (!state.running) startGame();
});

bestValue.textContent = String(state.best);

function updateHUD() {
  scoreValue.textContent = String(state.score);
  livesValue.textContent = '●'.repeat(Math.max(0, state.lives)) + '○'.repeat(Math.max(0, START_LIVES - state.lives));
  bestValue.textContent = String(state.best);
}

// ---------- Ciclo de vida ----------
function resetGame() {
  state.score = 0;
  state.lives = START_LIVES;
  state.level = 1;
  state.ballSpeed = BALL_LAUNCH_SPEED_BASE;
  state.gameOver = false;
  paddle.position.x = 0;
  finalScoreEl.style.display = 'none';
  buildBricks();
  parkBallOnPaddle();
  updateHUD();
}

function startGame() {
  resetGame();
  state.running = true;
  overlay.classList.add('hidden');
}

function nextLevel() {
  state.level += 1;
  state.ballSpeed = Math.min(BALL_MAX_SPEED, state.ballSpeed * LEVEL_SPEED_GROWTH);
  playLevelClearFanfare();
  buildBricks();
  parkBallOnPaddle();
}

function loseLife() {
  state.lives -= 1;
  updateHUD();
  if (state.lives <= 0) {
    endGame();
    return;
  }
  playLifeLostSound();
  spawnParticles(new THREE.Vector3(ballState.x, BALL_RADIUS, PADDLE_Z), { count: 14, geometry: sparkGeo, color: 0xff6b6b, speed: 2.5, life: 0.5 });
  parkBallOnPaddle();
}

function endGame() {
  state.running = false;
  state.gameOver = true;

  if (state.score > state.best) {
    state.best = state.score;
    localStorage.setItem('breakout3d_best', String(state.best));
  }

  playGameOverTone();
  spawnParticles(new THREE.Vector3(ballState.x, BALL_RADIUS, PADDLE_Z), { count: 24, geometry: debrisGeo, color: 0xff6b6b, speed: 4, upBias: 4, life: 0.8, gravity: -14 });

  overlayText.textContent = '¡Juego terminado!';
  finalScoreEl.style.display = 'block';
  finalScoreEl.textContent = `Puntos: ${state.score} · Nivel alcanzado: ${state.level} · Mejor: ${state.best}`;
  hintEl.textContent = 'ESPACIO / botón / toca para reintentar';
  overlay.classList.remove('hidden');
  updateHUD();
}

// ---------- Actualización de la paleta ----------
function updatePaddle(dt) {
  let dir = 0;
  if (keys.left) dir -= 1;
  if (keys.right) dir += 1;
  if (gamepadAxis !== 0) dir = gamepadAxis;

  paddle.position.x += dir * PADDLE_SPEED * dt;
  const bound = COURT_HALF_WIDTH - PADDLE_HALF_W;
  paddle.position.x = THREE.MathUtils.clamp(paddle.position.x, -bound, bound);

  if (state.waitingToLaunch) {
    ballState.x = paddle.position.x;
    ball.position.set(ballState.x, BALL_RADIUS, ballState.z);
  }
}

// ---------- Actualización de la pelota ----------
const MAX_STEP_DISTANCE = 0.15; // tope de desplazamiento por sub-paso, por debajo del grosor mínimo de colisión

function updateBall(dt) {
  if (state.waitingToLaunch) return;

  const travel = state.ballSpeed * dt;
  const steps = Math.max(1, Math.ceil(travel / MAX_STEP_DISTANCE));
  const subDt = dt / steps;

  for (let s = 0; s < steps; s++) {
    if (updateBallStep(subDt)) return; // se perdió la vida o se pasó de nivel: cortar el resto de sub-pasos
  }

  ball.position.set(ballState.x, BALL_RADIUS, ballState.z);
  ballLight.position.copy(ball.position);
}

// Devuelve true si el frame debe cortarse (vida perdida o nivel completado)
function updateBallStep(dt) {
  ballState.prevX = ballState.x;
  ballState.prevZ = ballState.z;
  ballState.x += ballState.vx * state.ballSpeed * dt;
  ballState.z += ballState.vz * state.ballSpeed * dt;

  // Rebote en muros laterales
  const xBound = COURT_HALF_WIDTH - BALL_RADIUS;
  if (ballState.x > xBound) {
    ballState.x = xBound;
    ballState.vx *= -1;
    playWallBounce();
    flashWall(rightWall);
    spawnParticles(new THREE.Vector3(ballState.x, BALL_RADIUS, ballState.z), { count: 6, color: 0x7a5cff, speed: 1.6, life: 0.3 });
  } else if (ballState.x < -xBound) {
    ballState.x = -xBound;
    ballState.vx *= -1;
    playWallBounce();
    flashWall(leftWall);
    spawnParticles(new THREE.Vector3(ballState.x, BALL_RADIUS, ballState.z), { count: 6, color: 0x7a5cff, speed: 1.6, life: 0.3 });
  }

  // Rebote en muro superior
  const zTopBound = TOP_WALL_Z + BALL_RADIUS;
  if (ballState.z < zTopBound) {
    ballState.z = zTopBound;
    ballState.vz *= -1;
    playWallBounce();
    flashWall(topWall);
    spawnParticles(new THREE.Vector3(ballState.x, BALL_RADIUS, ballState.z), { count: 6, color: 0x7a5cff, speed: 1.6, life: 0.3 });
  }

  // Colisión con la paleta
  if (
    ballState.vz > 0 &&
    ballState.z + BALL_RADIUS >= PADDLE_Z - 0.25 &&
    ballState.z + BALL_RADIUS < PADDLE_Z + 0.6 &&
    Math.abs(ballState.x - paddle.position.x) <= PADDLE_HALF_W + BALL_RADIUS
  ) {
    const offset = (ballState.x - paddle.position.x) / PADDLE_HALF_W; // -1..1
    const angle = offset * 0.7;
    const speedBoost = Math.min(BALL_MAX_SPEED, state.ballSpeed * BALL_HIT_GROWTH);
    state.ballSpeed = speedBoost;
    ballState.vx = Math.sin(angle);
    ballState.vz = -Math.cos(angle);
    playPaddleHit();
    spawnParticles(new THREE.Vector3(ballState.x, BALL_RADIUS, PADDLE_Z - 0.3), { count: 8, color: 0x6ec6ff, speed: 1.8, life: 0.35 });
  }

  // Colisión con ladrillos (una por frame, usando posición previa para decidir el eje de rebote)
  for (let i = 0; i < bricks.length; i++) {
    const b = bricks[i];
    const bx = b.mesh.position.x;
    const bz = b.mesh.position.z;
    const withinX = Math.abs(ballState.x - bx) <= b.halfW + BALL_RADIUS;
    const withinZ = Math.abs(ballState.z - bz) <= b.halfD + BALL_RADIUS;

    if (withinX && withinZ) {
      const wasWithinXPrev = Math.abs(ballState.prevX - bx) <= b.halfW + BALL_RADIUS;
      if (wasWithinXPrev) {
        ballState.vz *= -1; // golpe por arriba/abajo
      } else {
        ballState.vx *= -1; // golpe por un costado
      }

      state.score += b.points;
      playBrickBreak(b.points);
      spawnParticles(b.mesh.position.clone(), { count: 12, geometry: debrisGeo, color: b.color, speed: 2.6, upBias: 3, life: 0.5, gravity: -12 });

      scene.remove(b.mesh);
      b.mesh.material.dispose();
      bricks.splice(i, 1);
      updateHUD();

      if (bricks.length === 0) {
        nextLevel();
        return true;
      }
      break;
    }
  }

  // ¿Se perdió la pelota?
  if (ballState.z > LOSE_Z) {
    loseLife();
    return true;
  }

  return false;
}

// ---------- Bucle principal ----------
const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  pollGamepad();

  for (const wall of sideWalls) {
    wall.material.emissiveIntensity += (1 - wall.material.emissiveIntensity) * Math.min(1, dt * 4);
  }

  if (state.running && !state.gameOver) {
    updatePaddle(dt);
    updateBall(dt);
  }

  updateParticles(dt);
  renderer.render(scene, camera);
}

tick();
</script>
