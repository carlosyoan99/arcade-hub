<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong 3D</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0d0d1a;
    font-family: 'Courier New', monospace;
  }
  #canvas-container { position: fixed; inset: 0; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 20px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 24px;
    color: #eaeaea;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  #hud .you-block { text-align: left; }
  #hud .streak-block { text-align: center; }
  #hud .ai-block { text-align: right; }
  #hud .label { font-size: 11px; letter-spacing: 2px; opacity: 0.6; }
  #hud .value { font-size: 30px; font-weight: bold; }
  #hud .streak-block .value { font-size: 18px; }

  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: radial-gradient(circle at 50% 40%, rgba(30,30,55,0.55), rgba(8,8,16,0.88));
    color: #f2f2f2;
    text-align: center;
    z-index: 20;
    transition: opacity 0.25s ease;
  }
  #overlay h1 { font-size: 28px; letter-spacing: 3px; }
  #overlay p { opacity: 0.75; font-size: 13px; max-width: 340px; line-height: 1.6; }
  #overlay .hint { font-size: 12px; opacity: 0.5; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #finalScore { font-size: 15px; opacity: 0.9; }

  kbd {
    display: inline-block; padding: 2px 8px; margin: 0 2px;
    border: 1px solid #999; border-radius: 4px;
    font-size: 11px; background: rgba(255,255,255,0.08);
  }

  #touchControls {
    position: fixed; bottom: 24px; left: 0; right: 0;
    display: none; flex-direction: column; align-items: center; gap: 10px;
    z-index: 15;
  }
  #touchControls .row { display: flex; gap: 16px; }
  #touchControls button {
    width: 84px; height: 64px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff; font-size: 13px; letter-spacing: 1px;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s ease, transform 0.1s ease;
  }
  #touchControls button:active,
  #touchControls button.is-pressed {
    background: rgba(255,255,255,0.28);
    transform: scale(0.94);
  }
  @media (hover: none) and (pointer: coarse) {
    #touchControls { display: flex; }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="hud">
  <div class="you-block">
    <div class="label">TÚ</div>
    <div class="value" id="playerScoreValue">0</div>
  </div>
  <div class="streak-block">
    <div class="label">VICTORIAS</div>
    <div class="value" id="winsValue">0</div>
  </div>
  <div class="ai-block">
    <div class="label">IA</div>
    <div class="value" id="aiScoreValue">0</div>
  </div>
</div>

<div id="overlay">
  <h1>PONG 3D</h1>
  <p id="overlayText">Primero en llegar a 7 puntos gana. Mové tu paleta para devolver la pelota.</p>
  <p class="hint" id="hintEl"><kbd>↑</kbd><kbd>↓</kbd> / botones / stick del mando mover &nbsp;·&nbsp; ESPACIO para empezar</p>
</div>

<div id="touchControls">
  <div class="row">
    <button id="btnUp">▲ ARRIBA</button>
    <button id="btnDown">▼ ABAJO</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.165.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* ============================================================
   PONG 3D
   Vanilla JS + Three.js (única dependencia externa, justificada
   por el renderizado 3D). Un solo archivo, sin build step.
   ============================================================ */

// ---------- Constantes de juego ----------
const COURT_HALF_WIDTH = 8;      // eje X: de paleta a paleta
const COURT_HALF_DEPTH = 4.5;    // eje Z: límites arriba/abajo
const PADDLE_HALF_LEN  = 0.9;    // mitad del largo de la paleta (en Z)
const PADDLE_X_OFFSET  = COURT_HALF_WIDTH - 0.5;
const PADDLE_SPEED     = 9;
const AI_SPEED         = 7.2;
const BALL_RADIUS      = 0.25;
const BALL_BASE_SPEED  = 6.5;
const BALL_MAX_SPEED   = 16;
const BALL_SPEED_GROWTH = 1.045;
const WIN_SCORE        = 7;

// ---------- Estado global ----------
const state = {
  running: false,
  gameOver: false,
  playerScore: 0,
  aiScore: 0,
  wins: Number(localStorage.getItem('pong3d_wins') || 0),
};

// ---------- Escena / cámara / render ----------
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d1a);
scene.fog = new THREE.Fog(0x0d0d1a, 20, 40);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 200
);
camera.position.set(0, 13.5, 10.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// ---------- Luces ----------
const hemi = new THREE.HemisphereLight(0x9aa7ff, 0x0d0d1a, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xbcd4ff, 1.0);
sun.position.set(-6, 16, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -12;
scene.add(sun);

const ballLight = new THREE.PointLight(0x8de8ff, 1.2, 6);
scene.add(ballLight);

// ---------- Cancha ----------
const courtMat = new THREE.MeshStandardMaterial({ color: 0x14142a, roughness: 0.85 });
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(COURT_HALF_WIDTH * 2 + 1, 0.3, COURT_HALF_DEPTH * 2 + 1),
  courtMat
);
floor.position.y = -0.15;
floor.receiveShadow = true;
scene.add(floor);

// Línea central discontinua
const centerLineMat = new THREE.MeshStandardMaterial({ color: 0x3a3a66, roughness: 0.6 });
for (let z = -COURT_HALF_DEPTH + 0.3; z < COURT_HALF_DEPTH; z += 0.7) {
  const dash = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 0.35), centerLineMat);
  dash.position.set(0, 0.02, z);
  scene.add(dash);
}

// Muros superior/inferior (con destello al rebotar)
const wallMat = new THREE.MeshStandardMaterial({ color: 0x5568ff, emissive: 0x1a2280, roughness: 0.4 });
const walls = [];
for (const side of [-1, 1]) {
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(COURT_HALF_WIDTH * 2, 0.4, 0.25),
    wallMat.clone()
  );
  wall.position.set(0, 0.2, side * COURT_HALF_DEPTH);
  wall.castShadow = true;
  scene.add(wall);
  walls.push(wall);
}

function flashWall(wall) {
  wall.material.emissiveIntensity = 3;
}

// ---------- Paletas ----------
const paddleGeo = new THREE.BoxGeometry(0.4, 0.5, PADDLE_HALF_LEN * 2);
const playerMat = new THREE.MeshStandardMaterial({ color: 0x6ee7b7, emissive: 0x0d3d2a, roughness: 0.5 });
const aiMat = new THREE.MeshStandardMaterial({ color: 0xff8a65, emissive: 0x4a1f10, roughness: 0.5 });

const playerPaddle = new THREE.Mesh(paddleGeo, playerMat);
playerPaddle.position.set(-PADDLE_X_OFFSET, 0.25, 0);
playerPaddle.castShadow = true;
scene.add(playerPaddle);

const aiPaddle = new THREE.Mesh(paddleGeo, aiMat);
aiPaddle.position.set(PADDLE_X_OFFSET, 0.25, 0);
aiPaddle.castShadow = true;
scene.add(aiPaddle);

// ---------- Pelota ----------
const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x8de8ff, emissiveIntensity: 0.6, roughness: 0.3 });
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS, 16, 16), ballMat);
ball.castShadow = true;
ball.position.y = BALL_RADIUS;
scene.add(ball);

const ballState = { x: 0, z: 0, vx: 0, vz: 0, speed: BALL_BASE_SPEED };

function serveBall(towardPlayer) {
  ballState.x = 0;
  ballState.z = 0;
  ballState.speed = BALL_BASE_SPEED;
  const dir = towardPlayer ? -1 : 1;
  const angle = (Math.random() - 0.5) * 0.7;
  ballState.vx = Math.cos(angle) * dir;
  ballState.vz = Math.sin(angle);
  ball.position.set(0, BALL_RADIUS, 0);
}

// ---------- Sonido (sintetizado con Web Audio API) ----------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep({ freq = 440, freqEnd = null, duration = 0.12, type = 'sine', volume = 0.2 }) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
  gain.gain.setValueAtTime(volume, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration);
}
function playPaddleHit() { beep({ freq: 340, freqEnd: 440, duration: 0.08, type: 'square', volume: 0.18 }); }
function playWallBounce() { beep({ freq: 220, freqEnd: 260, duration: 0.06, type: 'sine', volume: 0.12 }); }
function playScoreSound(playerScored) {
  beep({ freq: playerScored ? 500 : 220, freqEnd: playerScored ? 780 : 120, duration: 0.3, type: 'sawtooth', volume: 0.2 });
}
function playWinFanfare() {
  [660, 880, 1100, 1320].forEach((freq, i) => {
    setTimeout(() => beep({ freq, duration: 0.14, type: 'triangle', volume: 0.2 }), i * 100);
  });
}
function playLoseTone() {
  [440, 330, 220].forEach((freq, i) => {
    setTimeout(() => beep({ freq, duration: 0.2, type: 'sawtooth', volume: 0.18 }), i * 130);
  });
}

// ---------- Partículas (chispas de contacto) ----------
const particles = [];
const sparkGeo = new THREE.SphereGeometry(0.05, 6, 6);

function spawnSparks(position, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
    const mesh = new THREE.Mesh(sparkGeo, mat);
    mesh.position.copy(position);
    scene.add(mesh);
    const angle = Math.random() * Math.PI * 2;
    const radial = 1.5 + Math.random() * 2;
    particles.push({
      mesh,
      velocity: new THREE.Vector3(Math.cos(angle) * radial, 1.5 + Math.random() * 2, Math.sin(angle) * radial),
      gravity: -8,
      life: 0.4,
      maxLife: 0.4,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.velocity.y += p.gravity * dt;
    p.mesh.position.addScaledVector(p.velocity, dt);
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.material.dispose();
      particles.splice(i, 1);
      continue;
    }
    p.mesh.material.opacity = Math.max(0, p.life / p.maxLife);
  }
}

// ---------- Entrada: teclado ----------
const keys = { up: false, down: false };

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); keys.up = true; }
  if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); keys.down = true; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (!state.running) startGame();
  }
  if (e.code === 'KeyR' && !state.running) {
    e.preventDefault();
    startGame();
  }
});
window.addEventListener('keyup', (e) => {
  if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = false;
  if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = false;
});

// ---------- Entrada: táctil ----------
const btnUp = document.getElementById('btnUp');
const btnDown = document.getElementById('btnDown');

function bindHoldButton(btn, onDown, onUp) {
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); btn.classList.add('is-pressed'); });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); btn.classList.remove('is-pressed'); });
  btn.addEventListener('touchcancel', (e) => { e.preventDefault(); onUp(); btn.classList.remove('is-pressed'); });
}
bindHoldButton(btnUp, () => { keys.up = true; }, () => { keys.up = false; });
bindHoldButton(btnDown, () => { keys.down = true; }, () => { keys.down = false; });

container.addEventListener('pointerdown', () => {
  if (!state.running) startGame();
});

// ---------- Entrada: gamepad ----------
let gamepadIndex = null;
let prevStart = false;

window.addEventListener('gamepadconnected', (e) => { gamepadIndex = e.gamepad.index; });
window.addEventListener('gamepaddisconnected', (e) => { if (gamepadIndex === e.gamepad.index) gamepadIndex = null; });

let gamepadAxis = 0;

function pollGamepad() {
  if (!navigator.getGamepads) return;
  const pads = navigator.getGamepads();
  const gp = (gamepadIndex !== null ? pads[gamepadIndex] : null) || pads[0];
  if (!gp) { gamepadAxis = 0; return; }

  const stick = gp.axes[1] ?? 0;
  gamepadAxis = Math.abs(stick) > 0.15 ? stick : 0;

  const dpadUp = !!gp.buttons[12]?.pressed;
  const dpadDown = !!gp.buttons[13]?.pressed;
  if (dpadUp) gamepadAxis = -1;
  if (dpadDown) gamepadAxis = 1;

  const startHeld = !!(gp.buttons[9]?.pressed || gp.buttons[0]?.pressed);
  if (startHeld && !prevStart && !state.running) startGame();
  prevStart = startHeld;
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- HUD / Overlay ----------
const playerScoreValue = document.getElementById('playerScoreValue');
const aiScoreValue = document.getElementById('aiScoreValue');
const winsValue = document.getElementById('winsValue');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const hintEl = document.getElementById('hintEl');

const finalScoreEl = document.createElement('p');
finalScoreEl.id = 'finalScore';
finalScoreEl.style.display = 'none';
overlay.insertBefore(finalScoreEl, hintEl);

overlay.addEventListener('pointerdown', () => {
  if (!state.running) startGame();
});

winsValue.textContent = String(state.wins);

function updateHUD() {
  playerScoreValue.textContent = String(state.playerScore);
  aiScoreValue.textContent = String(state.aiScore);
  winsValue.textContent = String(state.wins);
}

// ---------- Ciclo de vida ----------
function resetGame() {
  state.playerScore = 0;
  state.aiScore = 0;
  state.gameOver = false;
  playerPaddle.position.z = 0;
  aiPaddle.position.z = 0;
  finalScoreEl.style.display = 'none';
  serveBall(Math.random() > 0.5);
  updateHUD();
}

function startGame() {
  resetGame();
  state.running = true;
  overlay.classList.add('hidden');
}

function endGame(playerWon) {
  state.running = false;
  state.gameOver = true;

  if (playerWon) {
    state.wins += 1;
    localStorage.setItem('pong3d_wins', String(state.wins));
    playWinFanfare();
    spawnSparks(new THREE.Vector3(0, BALL_RADIUS, 0), 0x6ee7b7, 24);
  } else {
    playLoseTone();
    spawnSparks(new THREE.Vector3(0, BALL_RADIUS, 0), 0xff8a65, 24);
  }

  overlayText.textContent = playerWon ? '¡Ganaste!' : 'Perdiste';
  finalScoreEl.style.display = 'block';
  finalScoreEl.textContent = `Marcador final: ${state.playerScore} - ${state.aiScore} · Victorias: ${state.wins}`;
  hintEl.textContent = 'ESPACIO / botón / toca para reintentar';
  overlay.classList.remove('hidden');
  updateHUD();
}

// ---------- Actualización de paletas ----------
function updatePlayerPaddle(dt) {
  let dir = 0;
  if (keys.up) dir -= 1;
  if (keys.down) dir += 1;
  if (gamepadAxis !== 0) dir = gamepadAxis;

  playerPaddle.position.z += dir * PADDLE_SPEED * dt;
  const bound = COURT_HALF_DEPTH - PADDLE_HALF_LEN;
  playerPaddle.position.z = THREE.MathUtils.clamp(playerPaddle.position.z, -bound, bound);
}

function updateAiPaddle(dt) {
  const bound = COURT_HALF_DEPTH - PADDLE_HALF_LEN;
  // Sigue a la pelota solo cuando viene hacia la IA; si no, vuelve al centro.
  const target = ballState.vx > 0 ? ballState.z : ballState.z * 0.3;
  const diff = target - aiPaddle.position.z;
  const step = THREE.MathUtils.clamp(diff, -AI_SPEED * dt, AI_SPEED * dt);
  aiPaddle.position.z = THREE.MathUtils.clamp(aiPaddle.position.z + step, -bound, bound);
}

// ---------- Actualización de la pelota ----------
function updateBall(dt) {
  ballState.x += ballState.vx * ballState.speed * dt;
  ballState.z += ballState.vz * ballState.speed * dt;

  // Rebote en muros superior/inferior
  const zBound = COURT_HALF_DEPTH - BALL_RADIUS;
  if (ballState.z > zBound) {
    ballState.z = zBound;
    ballState.vz *= -1;
    playWallBounce();
    flashWall(walls[1]);
    spawnSparks(new THREE.Vector3(ballState.x, BALL_RADIUS, ballState.z), 0x5568ff, 6);
  } else if (ballState.z < -zBound) {
    ballState.z = -zBound;
    ballState.vz *= -1;
    playWallBounce();
    flashWall(walls[0]);
    spawnSparks(new THREE.Vector3(ballState.x, BALL_RADIUS, ballState.z), 0x5568ff, 6);
  }

  // Colisión con paleta del jugador (izquierda)
  const playerX = -PADDLE_X_OFFSET;
  if (ballState.vx < 0 && ballState.x - BALL_RADIUS <= playerX + 0.3 && ballState.x - BALL_RADIUS > playerX - 1.0) {
    if (Math.abs(ballState.z - playerPaddle.position.z) <= PADDLE_HALF_LEN + BALL_RADIUS) {
      bounceOffPaddle(playerPaddle, 1);
      playPaddleHit();
      spawnSparks(new THREE.Vector3(playerX + 0.2, BALL_RADIUS, ballState.z), 0x6ee7b7, 10);
    }
  }

  // Colisión con paleta de la IA (derecha)
  const aiX = PADDLE_X_OFFSET;
  if (ballState.vx > 0 && ballState.x + BALL_RADIUS >= aiX - 0.3 && ballState.x + BALL_RADIUS < aiX + 1.0) {
    if (Math.abs(ballState.z - aiPaddle.position.z) <= PADDLE_HALF_LEN + BALL_RADIUS) {
      bounceOffPaddle(aiPaddle, -1);
      playPaddleHit();
      spawnSparks(new THREE.Vector3(aiX - 0.2, BALL_RADIUS, ballState.z), 0xff8a65, 10);
    }
  }

  // ¿Punto anotado?
  if (ballState.x < playerX - 0.7) {
    state.aiScore += 1;
    playScoreSound(false);
    spawnSparks(new THREE.Vector3(playerX, BALL_RADIUS, ballState.z), 0xff8a65, 18);
    updateHUD();
    if (state.aiScore >= WIN_SCORE) { endGame(false); return; }
    serveBall(false);
  } else if (ballState.x > aiX + 0.7) {
    state.playerScore += 1;
    playScoreSound(true);
    spawnSparks(new THREE.Vector3(aiX, BALL_RADIUS, ballState.z), 0x6ee7b7, 18);
    updateHUD();
    if (state.playerScore >= WIN_SCORE) { endGame(true); return; }
    serveBall(true);
  }

  ball.position.set(ballState.x, BALL_RADIUS, ballState.z);
  ballLight.position.copy(ball.position);
}

function bounceOffPaddle(paddle, xDir) {
  const offset = (ballState.z - paddle.position.z) / PADDLE_HALF_LEN; // -1..1
  const angle = offset * 0.6; // controla el ángulo de rebote como en el Pong clásico
  ballState.speed = Math.min(BALL_MAX_SPEED, ballState.speed * BALL_SPEED_GROWTH);
  ballState.vx = Math.cos(angle) * xDir;
  ballState.vz = Math.sin(angle) + offset * 0.3;
  const len = Math.hypot(ballState.vx, ballState.vz) || 1;
  ballState.vx /= len;
  ballState.vz /= len;
}

// ---------- Bucle principal ----------
const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  pollGamepad();

  for (const wall of walls) {
    wall.material.emissiveIntensity += (1 - wall.material.emissiveIntensity) * Math.min(1, dt * 4);
  }

  if (state.running && !state.gameOver) {
    updatePlayerPaddle(dt);
    updateAiPaddle(dt);
    updateBall(dt);
  }

  updateParticles(dt);
  renderer.render(scene, camera);
}

tick();
</script>
</body>
</html>
