<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Centipede — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='20' y='40' width='60' height='20' rx='8' fill='%236ee7b7'/%3E%3Ccircle cx='22' cy='35' r='5' fill='%23ff6b6b'/%3E%3Ccircle cx='30' cy='35' r='5' fill='%23ff6b6b'/%3E%3Ccircle cx='38' cy='35' r='5' fill='%23ff6b6b'/%3E%3Ccircle cx='46' cy='35' r='5' fill='%23ff6b6b'/%3E%3Ccircle cx='54' cy='35' r='5' fill='%23ff6b6b'/%3E%3Ccircle cx='62' cy='35' r='5' fill='%23ff6b6b'/%3E%3Ccircle cx='70' cy='35' r='5' fill='%23ff6b6b'/%3E%3Cpolygon points='78,45 88,40 88,50' fill='%236ee7b7'/%3E%3Ccircle cx='62' cy='65' r='4' fill='%236ec6ff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <span>◈ Cargando...</span>
    </div>
    <canvas id="gc" aria-label="Centipede - Arcade Hub"></canvas>
    <div id="announce" aria-live="polite" aria-atomic="true" class="sr-only"></div>

    <div id="hud">
      <div class="sg">
        <div class="sb score">
          <div class="label">Puntaje</div>
          <div class="value" id="sc">0</div>
        </div>
        <div class="sp">·</div>
        <div class="sb lives">
          <div class="label">Naves</div>
          <div class="value" id="lv">●●●</div>
        </div>
        <div class="sp">·</div>
        <div class="sb best">
          <div class="label">Récord</div>
          <div class="value" id="bst">0</div>
        </div>
      </div>
    </div>

    <div id="overlay">
      <h1><span class="accent">◈</span> CENTIPEDE <span class="accent">◈</span></h1>
      <p id="ot">
        Dispará al ciempiés mientras serpentea por el hongo. Cada segmento que destruyas se
        convierte en un hongo nuevo.
      </p>
      <p id="fs" style="display: none"></p>
      <p class="hint" id="he">
        <kbd>←</kbd><kbd>→</kbd> <kbd>↑</kbd><kbd>↓</kbd> mover &nbsp;·&nbsp;
        <kbd>Espacio</kbd> disparar / empezar
      </p>
      <div class="vb">2D · canvas · sin dependencias</div>
    </div>

    <div id="tc">
      <button id="bL" aria-label="Izquierda">◀</button>
      <button id="bF" class="btn-fire" aria-label="Disparar">🔥</button>
      <button id="bR" aria-label="Derecha">▶</button>
    </div>

    <script type="module" src="./script.js"></script>

    <div id="gameBar">
      <button id="hubBtn" aria-label="Volver al Arcade Hub" title="Volver al Arcade Hub">
        ← Arcade
      </button>
      <button id="fsBtn" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
      <button id="helpBtn" aria-label="Ayuda" title="Ayuda">❓</button>
    </div>
  </body>
</html>
