<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pole Position — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='30' width='80' height='40' rx='10' fill='%23ff2d78'/%3E%3Ccircle cx='30' cy='70' r='10' fill='%23333'/%3E%3Ccircle cx='70' cy='70' r='10' fill='%23333'/%3E%3Crect x='15' y='35' width='30' height='15' rx='3' fill='%2300f0ff' opacity='0.6'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" role="img" aria-label="Pole Position - Arcade Hub"></canvas>
    <!-- HUD -->
    <div id="hud">
      <div class="score-group">
        <div class="score-block score">
          <div class="label">Tiempo</div>
          <div class="value" id="timeValue">60</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block best">
          <div class="label">Posición</div>
          <div class="value" id="posValue">1°</div>
        </div>
      </div>
      <div class="speed-indicator">
        <div class="label">Vel.</div>
        <div class="value" id="speedValue">0</div>
      </div>
    </div>

    <!-- Overlay -->
    <div id="overlay">
      <h1><span class="accent">◈</span> POLE POSITION <span class="accent">◈</span></h1>
      <p id="overlayText">
        Calificá en menos de 35 segundos para empezar en pole position. Ganá la carrera esquivando
        rivales y usando el turbo.
      </p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>←</kbd><kbd>→</kbd> girar &nbsp;·&nbsp; <kbd>↑</kbd> acelerar &nbsp;·&nbsp;
        <kbd>↓</kbd> frenar &nbsp;·&nbsp; <kbd>Espacio</kbd> turbo
      </p>
      <div class="version-badge">2D · canvas · sin dependencias</div>
    </div>

    <!-- Touch controls -->
    <div id="touchControls">
      <div class="dpad">
        <button id="btnUp" aria-label="Acelerar">▲</button>
        <button id="btnLeft" aria-label="Izquierda">◀</button>
        <button id="btnTurbo" aria-label="Turbo" style="font-size: 1.4em">⚡</button>
        <button id="btnRight" aria-label="Derecha">▶</button>
        <button id="btnDown" aria-label="Frenar">▼</button>
      </div>
    </div>

    <div id="loading">Cargando…</div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
