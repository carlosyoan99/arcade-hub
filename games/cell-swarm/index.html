<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cell Swarm — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='36' fill='%2300f5ff' opacity='0.3'/%3E%3Ccircle cx='50' cy='50' r='24' fill='%2300f5ff'/%3E%3Ccircle cx='40' cy='42' r='4' fill='%23fff'/%3E%3Ccircle cx='60' cy='42' r='4' fill='%23fff'/%3E%3Ccircle cx='50' cy='58' r='6' fill='%23fff'/%3E%3Ccircle cx='50' cy='52' r='8' fill='rgba(0,0,0,0.1)'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" role="img" aria-label="Cell Swarm - Arcade Hub"></canvas>
    <!-- HUD -->
    <div id="hud">
      <div class="hud-group">
        <div class="hud-item mass">
          <div class="label">Masa</div>
          <div class="value" id="massValue">10</div>
        </div>
        <div class="hud-divider"></div>
        <div class="hud-item rank">
          <div class="label">Rango</div>
          <div class="value" id="rankValue">—</div>
        </div>
      </div>
    </div>

    <!-- Action buttons -->
    <div id="actions">
      <button class="action-btn" id="btnSplit" aria-label="Dividir">⟐ DIVIDIR</button>
      <button class="action-btn" id="btnEject" aria-label="Eyectar">◉ EYECTAR</button>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboard">
      <div class="lb-header">◈ RANKING ◈</div>
      <div id="lbEntries"></div>
    </div>

    <!-- Name Entry Overlay -->
    <div id="nameOverlay">
      <h1><span class="accent">◈</span> CELL SWARM <span class="accent">◈</span></h1>
      <p>Elegí tu nombre para empezar</p>
      <input
        type="text"
        id="nameInput"
        placeholder="Tu nombre..."
        maxlength="15"
        autocomplete="off"
        autofocus
      />
      <p class="hint">Nombres especiales cambian tu apariencia 🎨</p>
      <button id="btnStart">◈ COMENZAR</button>
      <div class="version-badge">2D · canvas · agar.io-style</div>
    </div>

    <!-- Game Over Overlay -->
    <div id="overlay" class="hidden">
      <h1>☠ DEVORADO ☠</h1>
      <p id="overlayText">Te comieron...</p>
      <p id="finalScore"></p>
      <p class="hint"><kbd>R</kbd> reintentar · tocar para empezar</p>
      <div id="deathParticles"></div>
    </div>

    <!-- Touch controls -->
    <div id="touchControls">
      <button id="tcSplit" aria-label="Dividir">⟐</button>
      <button id="tcEject" aria-label="Eyectar">◉</button>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
