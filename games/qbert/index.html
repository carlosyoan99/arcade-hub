<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q*bert — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='34' fill='%2300f0ff'/%3E%3Ccircle cx='78' cy='34' r='10' fill='%2300f0ff'/%3E%3Ccircle cx='22' cy='34' r='10' fill='%2300f0ff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" role="img" aria-label="Q*bert - Arcade Hub"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="score-group">
        <div class="score-block score">
          <div class="label">Puntos</div>
          <div class="value" id="scoreValue">0</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block best">
          <div class="label">Mejor</div>
          <div class="value" id="bestValue">0</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block">
          <div class="label">Nivel</div>
          <div class="value" id="levelValue">1</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block">
          <div class="label">Vidas</div>
          <div class="value" id="livesValue">3</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block">
          <div class="label">Enemigos</div>
          <div class="value" id="enemiesValue">0</div>
        </div>
      </div>
    </div>

    <!-- Overlay -->
    <div id="overlay">
      <h1><span class="accent">◈</span> Q*BERT <span class="accent">◈</span></h1>
      <p id="overlayText">
        Piramid isométrico: saltá sobre los cubos para cambiarles el color y completá cada nivel
        esquivando a los enemigos.
      </p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>Q</kbd>/<kbd>E</kbd> subir &nbsp;·&nbsp; <kbd>A</kbd>/<kbd>D</kbd> bajar &nbsp;·&nbsp;
        <kbd>P</kbd> pausa
      </p>
      <div class="version-badge">2D · canvas · sin dependencias</div>
    </div>

    <!-- Touch controls -->
    <div id="touchControls">
      <div class="pad-diag">
        <button id="btnUL" aria-label="Arriba izquierda">↖</button>
        <button id="btnUR" aria-label="Arriba derecha">↗</button>
        <button id="btnDL" aria-label="Abajo izquierda">↙</button>
        <button id="btnDR" aria-label="Abajo derecha">↘</button>
      </div>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
