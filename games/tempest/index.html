<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tempest — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,10 90,50 50,90 10,50' fill='none' stroke='%2300f0ff' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23ff2d78'/%3E%3Ccircle cx='50' cy='20' r='4' fill='%23ffb800'/%3E%3Ccircle cx='80' cy='50' r='4' fill='%2339ff14'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" role="img" aria-label="Tempest - Arcade Hub"></canvas>
    <!-- HUD -->
    <div id="hud">
      <div class="score-group">
        <div class="score-block score">
          <div class="label">Puntos</div>
          <div class="value" id="scoreValue">0</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block best">
          <div class="label">Mejor</div>
          <div class="value" id="bestValue">0</div>
        </div>
      </div>
      <div class="speed-indicator">
        <div class="label">Nivel</div>
        <div class="value" id="levelValue">1</div>
      </div>
    </div>

    <!-- Overlay -->
    <div id="overlay">
      <h1><span class="accent">◈</span> TEMPEST <span class="accent">◈</span></h1>
      <p id="overlayText">
        Dispará a los enemigos que suben por el tubo. Rotá alrededor del borde y usá el jump para
        esquivar.
      </p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>←</kbd><kbd>→</kbd> rotar &nbsp;·&nbsp; <kbd>Espacio</kbd> disparar &nbsp;·&nbsp;
        <kbd>↑</kbd> jump &nbsp;·&nbsp; <kbd>P</kbd> pausa
      </p>
      <div class="version-badge">2D · canvas · sin dependencias</div>
    </div>

    <!-- Touch controls -->
    <div id="touchControls">
      <div class="dpad">
        <button id="btnUp" aria-label="Jump">↑</button>
        <button id="btnLeft" aria-label="Izquierda">◀</button>
        <button id="btnFire" aria-label="Disparar" style="font-size: 1.4em">🔥</button>
        <button id="btnRight" aria-label="Derecha">▶</button>
        <div class="empty"></div>
      </div>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
