<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paperboy — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='20' y='35' width='60' height='25' rx='8' fill='%23ffb800'/%3E%3Ccircle cx='30' cy='65' r='8' fill='%23333'/%3E%3Ccircle cx='70' cy='65' r='8' fill='%23333'/%3E%3Crect x='60' y='25' width='15' height='15' rx='2' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" role="img" aria-label="Paperboy - Arcade Hub"></canvas>
    <div id="hud">
      <div class="score-group">
        <div class="score-block score">
          <div class="label">Puntos</div>
          <div class="value" id="scoreValue">0</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block best">
          <div class="label">Mejor</div>
          <div class="value" id="bestValue">0</div>
        </div>
      </div>
      <div class="speed-indicator">
        <div class="label">Día</div>
        <div class="value" id="dayValue">1</div>
      </div>
    </div>
    <div id="overlay">
      <h1><span class="accent">◈</span> PAPERBOY <span class="accent">◈</span></h1>
      <p id="overlayText">
        Entregá periódicos a las casas suscritas. Esquivá autos, vallas y perros.
      </p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>↑</kbd><kbd>↓</kbd> cambiar carril &nbsp;·&nbsp; <kbd>→</kbd> lanzar periódico
        &nbsp;·&nbsp; <kbd>R</kbd> reiniciar
      </p>
      <div class="version-badge">2D · canvas · sin dependencias</div>
    </div>
    <div id="touchControls">
      <div class="dpad">
        <button id="btnUp" aria-label="Carril arriba">▲</button>
        <div class="empty"></div>
        <button id="btnThrow" aria-label="Lanzar" style="font-size: 1.2em">📰</button>
        <div class="empty"></div>
        <button id="btnDown" aria-label="Carril abajo">▼</button>
      </div>
    </div>
    <script type="module" src="./script.js"></script>
  </body>
</html>
