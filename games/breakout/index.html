<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Breakout — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='12' y='10' width='24' height='12' rx='2' fill='%23ff6b6b'/%3E%3Crect x='38' y='10' width='24' height='12' rx='2' fill='%23ffe066'/%3E%3Crect x='64' y='10' width='24' height='12' rx='2' fill='%236ee7b7'/%3E%3Crect x='25' y='26' width='24' height='12' rx='2' fill='%236ec6ff'/%3E%3Crect x='51' y='26' width='24' height='12' rx='2' fill='%23ffa76b'/%3E%3Crect x='25' y='80' width='50' height='12' rx='6' fill='%236ec6ff'/%3E%3Ccircle cx='50' cy='58' r='6' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" aria-label="Breakout - Arcade Hub"></canvas>
    <!-- HUD -->
    <div id="hud">
      <div class="level-badge">
        <div class="label">Nivel</div>
        <div class="value" id="levelDisplay">1</div>
      </div>
      <div class="score-group">
        <div class="score-block score">
          <div class="label">Puntos</div>
          <div class="value" id="scoreValue">0</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block lives">
          <div class="label">Vidas</div>
          <div class="value" id="livesValue">●●●</div>
        </div>
        <div class="score-sep">·</div>
        <div class="score-block best">
          <div class="label">Mejor</div>
          <div class="value" id="bestValue">0</div>
        </div>
      </div>
    </div>

    <!-- Overlay de inicio / fin -->
    <div id="overlay">
      <h1><span class="accent">◇</span> BREAKOUT <span class="accent">◇</span></h1>
      <p id="overlayText">
        Movete para no dejar caer la pelota y romper todos los ladrillos. Cada nivel es más rápido
        que el anterior.
      </p>
      <p id="finalScore" style="display: none"></p>
      <p class="hint" id="hintEl">
        <kbd>←</kbd><kbd>→</kbd> o <kbd>A</kbd><kbd>D</kbd> mover &nbsp;·&nbsp;
        <kbd>Espacio</kbd> lanzar / empezar
      </p>
      <div class="version-badge">2D · canvas · sin dependencias</div>
    </div>

    <!-- Touch controls -->
    <div id="touchControls">
      <button id="btnLeft" aria-label="Izquierda">◀</button>
      <button id="btnLaunch" class="btn-launch" aria-label="Lanzar">Lanzar</button>
      <button id="btnRight" aria-label="Derecha">▶</button>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
