<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Missile Command — Arcade Hub</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('arcadehub_theme') ||
        (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='0' y='80' width='100' height='20' fill='%233a5a3a'/%3E%3Crect x='15' y='60' width='12' height='20' rx='2' fill='%23888888'/%3E%3Crect x='44' y='60' width='12' height='20' rx='2' fill='%23888888'/%3E%3Crect x='73' y='60' width='12' height='20' rx='2' fill='%23888888'/%3E%3Ccircle cx='30' cy='42' r='4' fill='%23ff6b6b'/%3E%3Ccircle cx='50' cy='35' r='4' fill='%23ff6b6b'/%3E%3Ccircle cx='70' cy='42' r='4' fill='%23ff6b6b'/%3E%3Cline x1='30' y1='42' x2='30' y2='60' stroke='%23ff8888' stroke-width='1'/%3E%3Cline x1='50' y1='35' x2='50' y2='60' stroke='%23ff8888' stroke-width='1'/%3E%3Cline x1='70' y1='42' x2='70' y2='60' stroke='%23ff8888' stroke-width='1'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" role="img" aria-label="Missile Command - Arcade Hub"></canvas>
    <div id="hud">
      <div class="sg">
        <div class="sb score">
          <div class="label">Puntaje</div>
          <div class="value" id="scoreValue">0</div>
        </div>
        <div class="sp">·</div>
        <div class="sb cities">
          <div class="label">Ciudades</div>
          <div class="value" id="citiesValue">●●●●●●</div>
        </div>
        <div class="sp">·</div>
        <div class="sb ammo">
          <div class="label">Munición</div>
          <div class="value" id="ammoValue">30</div>
        </div>
        <div class="sp">·</div>
        <div class="sb wave">
          <div class="label">Oleada</div>
          <div class="value" id="waveValue">1</div>
        </div>
        <div class="sp">·</div>
        <div class="sb best">
          <div class="label">Récord</div>
          <div class="value" id="bestValue">0</div>
        </div>
        <div id="gdBadge" class="hud-badge" style="display: none">⚡ GUIADO</div>
      </div>
    </div>

    <div id="overlay">
      <h1><span class="accent">◈</span> MISSILE COMMAND <span class="accent">◈</span></h1>
      <p id="ot">
        Defendé tus ciudades de los misiles enemigos. Hacé clic o tocá para lanzar misiles
        interceptores.
      </p>
      <p id="fs" style="display: none"></p>
      <p class="hint" id="he">
        <kbd>Click</kbd> / tocar para disparar &nbsp;·&nbsp; <kbd>Espacio</kbd> empezar
      </p>
      <div class="vb">2D · canvas · sin dependencias</div>
    </div>

    <div id="tc">
      <button id="bF" class="btn-fire" aria-label="Disparar">🚀</button>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
