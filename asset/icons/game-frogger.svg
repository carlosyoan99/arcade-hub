  <rect x="80" y="62" width="20" height="10" rx="3" fill="#ffb800" opacity="0.4"/>
  <!-- frog -->
  <ellipse cx="64" cy="48" rx="12" ry="8" fill="#39ff14" opacity="0.9"/>
  <circle cx="56" cy="42" r="4" fill="#39ff14" opacity="0.85"/>
