<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </linearGradient>
    <linearGradient id="glowPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00aa"/>
      <stop offset="100%" stop-color="#cc00ff"/>
    </linearGradient>
    <linearGradient id="glowGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc66"/>
    </linearGradient>
    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbb00"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo rounded -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Borde sutil -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="18.5" fill="none" stroke="rgba(0,240,255,0.15)" stroke-width="1.5"/>

  <!-- D-Pad (cruz) -->
  <rect x="22" y="38" width="32" height="24" rx="5" fill="url(#glowCyan)" filter="url(#neon)"/>
  <rect x="38" y="22" width="24" height="56" rx="5" fill="url(#glowCyan)" filter="url(#neon)"/>
  <circle cx="50" cy="50" r="6" fill="#0a0a1a"/>

  <!-- Botón A (pink) -->
  <circle cx="72" cy="35" r="9" fill="url(#glowPink)" filter="url(#neon)"/>
  <text x="72" y="38.5" font-size="9" font-family="Arial,sans-serif" font-weight="bold" fill="#fff" text-anchor="middle">A</text>

  <!-- Botón B (green) -->
  <circle cx="84" cy="55" r="9" fill="url(#glowGreen)" filter="url(#neon)"/>
  <text x="84" y="58.5" font-size="9" font-family="Arial,sans-serif" font-weight="bold" fill="#0a0a1a" text-anchor="middle">B</text>

  <!-- Botón Start (amber, pequeño) -->
  <rect x="30" y="78" width="16" height="6" rx="3" fill="url(#glowAmber)" filter="url(#neon)"/>
  <rect x="54" y="78" width="16" height="6" rx="3" fill="url(#glowAmber)" filter="url(#neon)"/>
</svg>
