<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="20" fill="#0c0922"/>
  <!-- city buildings -->
  <rect x="24" y="76" width="14" height="28" rx="2" fill="#00f0ff" opacity="0.5"/>
  <rect x="56" y="66" width="14" height="38" rx="2" fill="#00f0ff" opacity="0.5"/>
  <rect x="88" y="72" width="14" height="32" rx="2" fill="#00f0ff" opacity="0.5"/>
  <!-- ground -->
  <line x1="16" y1="104" x2="112" y2="104" stroke="#00f0ff" stroke-width="1.5" opacity="0.2"/>
  <!-- incoming missile -->
  <line x1="30" y1="20" x2="90" y2="68" stroke="#ff2d78" stroke-width="2" opacity="0.7" stroke-dasharray="4 3"/>
  <circle cx="30" cy="20" r="3" fill="#ff2d78" opacity="0.8"/>
  <!-- interceptor -->
  <line x1="64" y1="80" x2="90" y2="68" stroke="#39ff14" stroke-width="1.5" opacity="0.6" stroke-dasharray="3 3"/>
  <!-- explosion -->
  <circle cx="90" cy="68" r="10" fill="#ffb800" opacity="0.3"/>
  <circle cx="90" cy="68" r="5" fill="#ffb800" opacity="0.5"/>
  <!-- more missiles -->
  <line x1="98" y1="16" x2="40" y2="52" stroke="#ff2d78" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 3"/>
  <circle cx="98" cy="16" r="2.5" fill="#ff2d78" opacity="0.5"/>
</svg>
