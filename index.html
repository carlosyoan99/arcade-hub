    <!-- Schema.org / JSON-LD -->
    <script type="application/ld+json" id="website-schema">
      {
        "@context": "https://schema.org",

        "name": "Arcade Engine",

      {

    <!-- Anti-FOUC: aplica el tema persistido antes del primer pintado. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('arcadehub_theme');
          var saved = raw ? JSON.parse(raw) : null;
          var theme =
            saved && saved.v === 1 && ['dark', 'light', 'retro'].indexOf(saved.data) >= 0
              ? saved.data
              : null;
          if (!theme) {
            theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DtUX5uQl.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DNNXxL-O.css">
  </head>
  <body>
    <a class="skip" href="#shelf">Saltar a la vitrina</a>

    <header class="topbar">
      <div class="brand">
        <h1>Arcade Engine</h1>
        <span class="brand__count" id="count">32 títulos</span>
      </div>
      <label class="search">
        <span class="visually-hidden">Buscar juegos</span>
        <input
          id="search"
          type="search"
          placeholder="Buscar título…"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <button id="theme" class="toolbar-button" type="button" data-testid="theme" aria-label="Cambiar tema">
        Tema: Oscuro
      </button>
    </header>

    <main class="shell">
      <section id="shelf" aria-labelledby="shelf-title">
        <h2 id="shelf-title" class="section-title">La vitrina</h2>
        <ul id="grid" class="grid" aria-label="Juegos disponibles"></ul>
        <p id="empty" class="empty" hidden>No hay juegos para esa búsqueda.</p>
      </section>

      <section id="stage" class="stage" aria-labelledby="stage-title" hidden>
        <div class="stage__top">
          <button id="back" class="back" type="button">← Volver a la vitrina</button>
          <label class="difficulty">
            <span>Dificultad</span>
            <select id="difficulty" aria-label="Dificultad del juego">
              <option value="easy">Fácil</option>
              <option value="normal" selected>Normal</option>
              <option value="hard">Difícil</option>
            </select>
          </label>
          <button
            id="fullscreen"
            class="toolbar-button"
            type="button"
            data-testid="fullscreen"
            aria-label="Pantalla completa (tecla F)"
          >
            ⛶ Pantalla completa
          </button>
          <h2 id="stage-title" class="stage__title"></h2>
        </div>
        <p class="stage__meta">
          <label class="seed">Semilla <output id="seed" data-testid="seed">12345</output></label>
          <button id="copy-seed" class="toolbar-button" type="button" data-testid="copy-seed">
            Copiar enlace
          </button>
          <label class="seed">Hash <output id="hash" data-testid="hash">—</output></label>
          <label class="seed">Entradas <output id="actions" data-testid="actions"></output></label>
        </p>
        <canvas id="screen" width="1024" height="700" aria-label="Pantalla del juego">
          Tu navegador no admite canvas.
        </canvas>
        <div
          id="touch-actions"
          class="touch-actions"
          data-testid="touch-actions"
          aria-label="Acciones táctiles del juego"
        ></div>
        <p id="hint" class="hint"></p>
      </section>
    </main>

    <p id="status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
    <p id="results" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>

  </body>
</html>
